name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]
        compiler: [gcc, clang]
        include:
          - arch: arm64
            compiler: gcc
            make_flags: CROSS_COMPILE=aarch64-linux-gnu-
            pkgs: gcc-aarch64-linux-gnu
          - arch: arm
            compiler: gcc
            make_flags: CROSS_COMPILE=arm-linux-gnueabihf-
            pkgs: gcc-arm-linux-gnueabihf
          - compiler: clang
            make_flags: LLVM=1
            pkgs: clang lld llvm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.pkgs }}

      - name: Build
        run: |
          cat arch/arm64/configs/msm8916_defconfig arch/arm/configs/msm8916_defconfig.part > arch/arm/configs/msm8916_defconfig
          make -j$(nproc) ${{ matrix.make_flags }} msm8916_defconfig
          echo CONFIG_WERROR=y >> .config
          make -j$(nproc) ${{ matrix.make_flags }}
